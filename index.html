<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b766c">
<meta name="description" content="Dingel Hafizia Madrasa Professional Management System">
<link rel="icon" href="./logo.png">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./style.css">
<title>Dingel Hafizia Madrasa — ERP</title>
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <img src="./logo.png" alt="Dingel Hafizia Madrasa" class="login-logo">
    <h1>ডিঙ্গেল হাফিজিয়া মাদ্রাসা</h1>
    <p>Professional Madrasa Management System</p>
    <form id="loginForm">
      <input id="passwordInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Password" required>
      <div id="loginError" class="error-text"></div>
      <button class="btn primary full" type="submit">Login to Dashboard</button>
    </form>
    <small class="login-note">Compatibility login · Password: 123</small>
  </div>
</div>

<div id="app" class="app hidden">
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <img src="./logo.png" alt="Logo">
      <div><b>ডিঙ্গেল হাফিজিয়া</b><small>Dingel Hafizia Madrasa</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-bottom">
      <button class="nav-btn logout" id="logoutBtn">↪ Logout</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn mobile-only">☰</button>
      <div><h2 id="pageTitle">Dashboard</h2><p id="pageSubtitle">মাদ্রাসার সামগ্রিক তথ্য</p></div>
      <div class="top-actions">
        <button id="refreshBtn" class="icon-btn" title="Refresh">↻</button>
        <button id="printBtn" class="icon-btn" title="Print">⎙</button>
      </div>
    </header>
    <section id="view" class="content"></section>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="./app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js", {scope:"./"}).catch(console.warn));
}
</script>
</body>
</html>
