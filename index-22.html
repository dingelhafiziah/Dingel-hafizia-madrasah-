<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b6b4f">
  <meta name="description" content="Dingel Hafizia Madrasa Management App">
  <title>Dingel Hafizia Madrasa</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- =========================
       LOGIN SCREEN
       ========================= -->
  <section id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="brand-mark">DH</div>
      <h1>ডিঙ্গেল হাফিজিয়া মাদ্রাসা</h1>
      <p>Dingel Hafizia Madrasa</p>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="emailInput">Email</label>
          <input id="emailInput" name="email" type="email"
                 placeholder="Enter email" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input id="passwordInput" name="password" type="password"
                 placeholder="Enter password" autocomplete="current-password" required>
        </div>

        <p id="loginError" class="form-error" aria-live="polite"></p>

        <button class="btn primary full-width" type="submit">
          Login
        </button>
      </form>
    </div>
  </section>

  <!-- =========================
       MAIN APPLICATION
       ========================= -->
  <div id="app" class="app-shell hidden">

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark small">DH</div>
        <div>
          <strong>Dingel Hafizia</strong>
          <span>Madrasa ERP</span>
        </div>
      </div>

      <nav id="nav" class="main-nav" aria-label="Main navigation"></nav>

      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn danger full-width" type="button">
          Logout
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main-content">

      <!-- TOP BAR -->
      <header class="topbar">
        <div class="topbar-left">
          <button id="menuBtn" class="icon-btn mobile-only" type="button"
                  aria-label="Open menu">☰</button>

          <div>
            <h1 id="pageTitle">Dashboard</h1>
            <p id="pageSubtitle">মাদ্রাসার সামগ্রিক তথ্য</p>
          </div>
        </div>

        <div class="topbar-actions">
          <button id="refreshBtn" class="btn secondary" type="button">
            ↻ Refresh
          </button>
          <button id="printBtn" class="btn outline" type="button">
            ⎙ Print
          </button>
        </div>
      </header>

      <!-- PAGE VIEW -->
      <section id="view" class="page-view" aria-live="polite"></section>

      <!-- FOOTER -->
      <footer class="app-footer">
        <span>© <span id="footerYear"></span> Dingel Hafizia Madrasa</span>
        <span>Professional Madrasa Management System</span>
      </footer>
    </main>
  </div>

  <!-- MODAL CONTAINER -->
  <div id="modalRoot"></div>

  <!-- TOAST CONTAINER -->
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <!-- Application scripts.
       Firebase/config/auth modules are loaded before app.js. -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="auth.js"></script>
  <script type="module" src="firestore.js"></script>
  <script type="module" src="app.js"></script>

  <script>
    document.getElementById("footerYear").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
